models:
  qwen35_9b:
    repo_id: "Qwen/Qwen3.5-9B"
    # This pipeline sends text only. Avoid AutoProcessor and its torchvision
    # dependency by loading Qwen through the causal-LM text interface.
    backend: "causal_lm"
    enabled: true
    disable_thinking: true
    load_in_4bit: true

  ministral3_8b:
    # Use the BF16 repository as the source for bitsandbytes NF4 quantization.
    repo_id: "mistralai/Ministral-3-8B-Instruct-2512-BF16"
    backend: "mistral3"
    enabled: true
    disable_thinking: false
    load_in_4bit: true

  llama31_8b:
    # Gated model: accept Meta's license on Hugging Face and authenticate first.
    repo_id: "meta-llama/Llama-3.1-8B-Instruct"
    backend: "causal_lm"
    enabled: true
    disable_thinking: false
    load_in_4bit: true

generation:
  max_new_tokens: 900
  temperature: 0.0
  cards_per_label: 10
  quantization:
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_use_double_quant: true
    bnb_4bit_compute_dtype: "bfloat16"
